[package]
name = "tinyinference-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral language-model, streaming, and hosted-provider APIs for Rust."
documentation = "https://docs.rs/tinyinference-llm"
readme = "../../README.md"
keywords = ["llm", "inference", "streaming", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
base64 = "0.23"
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tinyinference-core = { version = "0.3.0", path = "../tinyinference-core" }
# The model-facing tool protocol: prompt-guided rendering, text-mode parsing,
# argument repair, and streaming scrub. Owned once, in TinyTools, so this
# adapter and every host share one grammar table.
tinytools-agent = { version = "0.5.0", git = "https://github.com/tinyhumansai/tinytools", rev = "bd60b9b52f1998b4483b9cf107a72d3338e672f8" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
