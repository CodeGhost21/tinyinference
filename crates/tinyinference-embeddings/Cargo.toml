[package]
name = "tinyinference-embeddings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral embedding, vector-store, and retrieval APIs for Rust."
documentation = "https://docs.rs/tinyinference-embeddings"
readme = "../../README.md"
keywords = ["embeddings", "inference", "retrieval", "vectors"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-trait = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tinyinference-core = { version = "0.4.0", path = "../tinyinference-core" }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
http = "1"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
